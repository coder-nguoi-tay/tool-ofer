[package]
name = "obscura_antidetect_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
obscura = { path = "obscura-upstream/crates/obscura" }
obscura-cdp = { path = "obscura-upstream/crates/obscura-cdp", features = ["render", "stealth"] }


